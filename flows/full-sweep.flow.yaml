name: hamiltonjlucas/formularium-full-sweep
version: 0.2.0
description: >-
  Run every Formularium discovery engine over the freshly assembled physics catalog in
  parallel — validation, natural-units dimensional analysis, unit-annotation checks,
  the relationship graph, structural bridge analysis, curated symbolic derivations,
  orphan-constant relation discovery, and Buckingham-pi group enumeration — and merge
  the results into a single SweepReport with a rendered summary. The catalog assembly
  (fan-out to all 9 package GetCatalog nodes) is inlined at the head of the flow.

input_facade:
  message_name: SweepRequest
  description: Trigger for a full catalog sweep; carries no required data.
  fields:
    note:
      kind: string
      optional: true
      description: Optional free-form label for this sweep run; not used by any node.

nodes:
  - { alias: constants, package: hamiltonjlucas/formularium-constants@0.3.0, node: GetCatalog }
  - { alias: electroweak, package: hamiltonjlucas/formularium-electroweak@0.3.0, node: GetCatalog }
  - { alias: flavor, package: hamiltonjlucas/formularium-flavor@0.3.0, node: GetCatalog }
  - { alias: bz_cascade, package: hamiltonjlucas/formularium-bz-cascade@0.3.0, node: GetCatalog }
  - { alias: atomic, package: hamiltonjlucas/formularium-atomic@0.3.0, node: GetCatalog }
  - { alias: em_si, package: hamiltonjlucas/formularium-em-si@0.3.0, node: GetCatalog }
  - { alias: gravity_thermo, package: hamiltonjlucas/formularium-gravity-thermo@0.3.0, node: GetCatalog }
  - { alias: cosmology, package: hamiltonjlucas/formularium-cosmology@0.3.0, node: GetCatalog }
  - { alias: quantum_info, package: hamiltonjlucas/formularium-quantum-info@0.3.0, node: GetCatalog }
  - alias: assemble
    package: hamiltonjlucas/formularium-engine@0.3.1
    node: AssembleCatalog
    config:
      join: { kind: AND }
  - { alias: validate, package: hamiltonjlucas/formularium-engine@0.3.1, node: ValidateCatalog }
  - { alias: dims, package: hamiltonjlucas/formularium-engine@0.3.1, node: CheckDimensions }
  - { alias: units, package: hamiltonjlucas/formularium-engine@0.3.1, node: CheckUnits }
  - { alias: graph, package: hamiltonjlucas/formularium-engine@0.3.1, node: BuildGraph }
  - { alias: structure, package: hamiltonjlucas/formularium-engine@0.3.1, node: AnalyzeStructure }
  - { alias: derive, package: hamiltonjlucas/formularium-engine@0.3.1, node: DeriveRelations }
  - { alias: discover, package: hamiltonjlucas/formularium-engine@0.3.1, node: DiscoverRelations }
  - { alias: buckingham, package: hamiltonjlucas/formularium-engine@0.3.1, node: Buckingham }
  - alias: report
    package: hamiltonjlucas/formularium-engine@0.3.1
    node: AssembleSweepReport
    config:
      join: { kind: AND }

edges:
  - { from: "@flow_input", to: constants }
  - { from: "@flow_input", to: electroweak }
  - { from: "@flow_input", to: flavor }
  - { from: "@flow_input", to: bz_cascade }
  - { from: "@flow_input", to: atomic }
  - { from: "@flow_input", to: em_si }
  - { from: "@flow_input", to: gravity_thermo }
  - { from: "@flow_input", to: cosmology }
  - { from: "@flow_input", to: quantum_info }
  - { from: constants, to: assemble, adapter: { constants_json: "toJson(value)" } }
  - { from: electroweak, to: assemble, adapter: { electroweak_json: "toJson(value)" } }
  - { from: flavor, to: assemble, adapter: { flavor_json: "toJson(value)" } }
  - { from: bz_cascade, to: assemble, adapter: { bz_cascade_json: "toJson(value)" } }
  - { from: atomic, to: assemble, adapter: { atomic_json: "toJson(value)" } }
  - { from: em_si, to: assemble, adapter: { em_si_json: "toJson(value)" } }
  - { from: gravity_thermo, to: assemble, adapter: { gravity_thermo_json: "toJson(value)" } }
  - { from: cosmology, to: assemble, adapter: { cosmology_json: "toJson(value)" } }
  - { from: quantum_info, to: assemble, adapter: { quantum_info_json: "toJson(value)" } }
  - { from: assemble, to: validate }
  - { from: assemble, to: dims }
  - { from: assemble, to: units }
  - { from: assemble, to: graph }
  - { from: assemble, to: structure }
  - { from: assemble, to: derive }
  - { from: assemble, to: discover }
  - { from: assemble, to: buckingham }
  - { from: validate, to: report, adapter: { validation: "value" } }
  - { from: dims, to: report, adapter: { dimensions: "value" } }
  - { from: units, to: report, adapter: { units: "value" } }
  - { from: graph, to: report, adapter: { graph: "value" } }
  - { from: structure, to: report, adapter: { structure: "value" } }
  - { from: derive, to: report, adapter: { derive: "value" } }
  - { from: discover, to: report, adapter: { discover: "value" } }
  - { from: buckingham, to: report, adapter: { buckingham: "value" } }
