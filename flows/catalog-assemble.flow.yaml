name: hamiltonjlucas/formularium-catalog-assemble
version: 0.2.0
description: >-
  Assemble the complete Formularium physics catalog: fan out to every package's
  GetCatalog node (71 physical constants plus the 8 physics domain packages holding
  102 formula specs and their quantities) and merge the slices into one Catalog
  message — the input every Formularium engine node consumes.

input_facade:
  message_name: AssembleRequest
  description: Trigger for a catalog assembly; carries no required data.
  fields:
    note:
      kind: string
      optional: true
      description: Optional free-form label for this assembly run; not used by any node.

nodes:
  - { alias: constants, package: hamiltonjlucas/formularium-constants@0.3.0, node: GetCatalog }
  - { alias: electroweak, package: hamiltonjlucas/formularium-electroweak@0.3.0, node: GetCatalog }
  - { alias: flavor, package: hamiltonjlucas/formularium-flavor@0.3.0, node: GetCatalog }
  - { alias: bz_cascade, package: hamiltonjlucas/formularium-bz-cascade@0.3.0, node: GetCatalog }
  - { alias: atomic, package: hamiltonjlucas/formularium-atomic@0.3.0, node: GetCatalog }
  - { alias: em_si, package: hamiltonjlucas/formularium-em-si@0.3.0, node: GetCatalog }
  - { alias: gravity_thermo, package: hamiltonjlucas/formularium-gravity-thermo@0.3.0, node: GetCatalog }
  - { alias: cosmology, package: hamiltonjlucas/formularium-cosmology@0.3.0, node: GetCatalog }
  - { alias: quantum_info, package: hamiltonjlucas/formularium-quantum-info@0.3.0, node: GetCatalog }
  - alias: assemble
    package: hamiltonjlucas/formularium-engine@0.3.1
    node: AssembleCatalog
    config:
      join: { kind: AND }

edges:
  - { from: "@flow_input", to: constants }
  - { from: "@flow_input", to: electroweak }
  - { from: "@flow_input", to: flavor }
  - { from: "@flow_input", to: bz_cascade }
  - { from: "@flow_input", to: atomic }
  - { from: "@flow_input", to: em_si }
  - { from: "@flow_input", to: gravity_thermo }
  - { from: "@flow_input", to: cosmology }
  - { from: "@flow_input", to: quantum_info }
  # per-edge adapters: each source fills its own JSON-slice field; the AND join
  # merges field-wise (the engine's AssembleCatalog parses and merges the slices)
  - { from: constants, to: assemble, adapter: { constants_json: "toJson(value)" } }
  - { from: electroweak, to: assemble, adapter: { electroweak_json: "toJson(value)" } }
  - { from: flavor, to: assemble, adapter: { flavor_json: "toJson(value)" } }
  - { from: bz_cascade, to: assemble, adapter: { bz_cascade_json: "toJson(value)" } }
  - { from: atomic, to: assemble, adapter: { atomic_json: "toJson(value)" } }
  - { from: em_si, to: assemble, adapter: { em_si_json: "toJson(value)" } }
  - { from: gravity_thermo, to: assemble, adapter: { gravity_thermo_json: "toJson(value)" } }
  - { from: cosmology, to: assemble, adapter: { cosmology_json: "toJson(value)" } }
  - { from: quantum_info, to: assemble, adapter: { quantum_info_json: "toJson(value)" } }
