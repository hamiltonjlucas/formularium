// A physical constant: value + uncertainty in its conventional unit, natural-units mass
// dimension (hbar = c = 1; dimensionless iff mass_dim == 0), evidence tier, and source.
message ConstantSpec {
  // Catalog symbol, e.g. "M_W", "alpha", "G_N". Unique across the catalog.
  string symbol = 1;
  // Human-readable name, e.g. "W boson mass".
  string name = 2;
  // Value in the conventional unit given by `unit`.
  double value = 3;
  // Unit string, e.g. "GeV", "m^3/(kg*s^2)", "dimensionless".
  string unit = 4;
  // One-sigma measurement uncertainty in the same unit; absent for exact/defined values.
  optional double uncertainty = 5;
  // Natural-units mass dimension (hbar = c = 1). Dimensionless iff 0.
  double mass_dim = 6;
  // Evidence tier: established | derived | conjecture.
  string tier = 7;
  // Provenance: CODATA | PDG | NuFIT | Planck | derived | definition | convention.
  string source = 8;
  // Alternative symbols this constant is known by.
  repeated string aliases = 9;
  string notes = 10;
  // Formula ids especially relevant to this constant.
  repeated string related_formulas = 11;
}

// A physical quantity that appears in formulas but has no single catalog-fixed value
// (couplings, generic masses, derived-but-not-tabulated quantities).
message QuantitySpec {
  string symbol = 1;
  string name = 2;
  // Natural-units mass dimension (hbar = c = 1).
  double mass_dim = 3;
  // parameter | coupling | observable | derived.
  string kind = 4;
  string notes = 5;
}

// A formula: a sympy-parseable equation Eq(lhs, rhs) over catalog symbols, with tier and
// provenance. The owning package exposes it as a compute node evaluating rhs -> lhs.
message FormulaSpec {
  // Stable formula id, e.g. "W_mass". Unique across the catalog.
  string id = 1;
  string name = 2;
  // Verbatim sympy-parseable expression, always of the form "Eq(lhs, rhs)".
  string expression = 3;
  // Every catalog symbol the expression touches (including the LHS).
  repeated string symbols = 4;
  // The RHS free symbols — exactly the compute node's input fields, sorted.
  repeated string input_symbols = 5;
  // str(lhs): what the compute node's FormulaResult.value equals, e.g. "M_W" or "M_W/M_Z".
  string computes = 6;
  // Evidence tier: established | derived | conjecture.
  string tier = 7;
  string provenance = 8;
  repeated string refs = 9;
  string notes = 10;
  // Dimensional-consistency annotation, e.g. "consistent (mass_dim 1)".
  string dimensional_check = 11;
  // Owning domain package short name, e.g. "electroweak".
  string domain = 12;
}

// The shared output of every Formularium formula node.
message FormulaResult {
  // The evaluated result, in natural units (GeV powers) unless the formula's spec says
  // otherwise. Its meaning is `computes`.
  double value = 1;
  string formula_id = 2;
  // str(lhs) of the formula — what `value` is, e.g. "M_W", "M_Pl**2", "M_W/M_Z".
  string computes = 3;
  // Evidence tier of the formula that produced this value.
  string tier = 4;
}

// One domain package's slice of the catalog.
message DomainCatalog {
  // Domain short name, e.g. "electroweak".
  string domain = 1;
  repeated FormulaSpec formulas = 2;
  // Quantities referenced by this domain's formulas (may repeat across domains).
  repeated QuantitySpec quantities = 3;
}

// The full assembled catalog: every constant plus every domain's formulas/quantities.
message Catalog {
  repeated ConstantSpec constants = 1;
  repeated DomainCatalog domains = 2;
}

// ---- engine report messages ----

// One issue found by catalog validation.
message ValidationIssue {
  // error | warning.
  string severity = 1;
  // What the issue is about, e.g. a symbol or formula id.
  string scope = 2;
  string message = 3;
}

// Result of cross-package catalog validation (duplicate ids, unknown tiers/sources,
// unresolved symbol references).
message ValidationReport {
  bool passed = 1;
  repeated ValidationIssue issues = 2;
  int32 n_constants = 3;
  int32 n_quantities = 4;
  int32 n_formulas = 5;
}

// Dimensional consistency of one formula (natural-units mass dimensions of both sides).
message DimensionCheck {
  string formula_id = 1;
  bool consistent = 2;
  double lhs_mass_dim = 3;
  double rhs_mass_dim = 4;
  string detail = 5;
}

// Mass-dimension check over every formula in the catalog.
message DimensionsReport {
  repeated DimensionCheck checks = 1;
  int32 n_inconsistent = 2;
  // Rendered human-readable report.
  string markdown = 3;
}

// One constant's unit-string-derived mass dimension vs its stored annotation.
message UnitConversionCheck {
  string symbol = 1;
  string unit = 2;
  double stored_mass_dim = 3;
  double derived_mass_dim = 4;
  bool matches = 5;
}

// Unit-system validation over every constant.
message UnitsReport {
  repeated UnitConversionCheck checks = 1;
  int32 n_mismatches = 2;
  string markdown = 3;
}

// A node of the relationship graph.
message GraphNode {
  // Symbol or formula id.
  string id = 1;
  // constant | quantity | formula.
  string kind = 2;
}

// An edge of the relationship graph (formula "involves" symbol).
message GraphEdge {
  string source = 1;
  string target = 2;
}

// The bipartite relationship map: formulas linked to the symbols they involve.
message GraphReport {
  repeated GraphNode nodes = 1;
  repeated GraphEdge edges = 2;
  // Rendered catalog digest.
  string digest_markdown = 3;
}

// One dimensionless group found by Buckingham-pi analysis: product of symbols^exponents.
message BuckinghamGroup {
  repeated string symbols = 1;
  repeated int32 exponents = 2;
  // Numeric value of the group where all member values are known.
  optional double value = 3;
}

// One Buckingham-pi analysis over a set of quantities.
message BuckinghamSet {
  string label = 1;
  repeated string symbols = 2;
  repeated BuckinghamGroup groups = 3;
}

// Dimensionless-group enumeration: catalog natural-units mode and classic full-SI mode.
message BuckinghamReport {
  repeated BuckinghamSet catalog_mode = 1;
  repeated BuckinghamSet classic_mode = 2;
  string markdown = 3;
}

// One symbolic derivation: intermediates eliminated between catalog formulas.
message DerivationResult {
  string label = 1;
  repeated string source_formula_ids = 2;
  // Symbols eliminated by substitution.
  repeated string eliminated = 3;
  // validate (re-derives a known formula) | new (relation not stated in the catalog).
  string kind = 4;
  string lhs = 5;
  string rhs = 6;
  // Relative numeric residual at catalog values; absent if not numerically checkable.
  optional double residual = 7;
  string accuracy_note = 8;
}

// Curated symbolic-derivation results.
message DeriveReport {
  repeated DerivationResult derivations = 1;
  string markdown = 2;
}

// A candidate numeric relation from the discovery scan.
message RelationCandidate {
  // The orphan constant the relation targets.
  string target = 1;
  // Basis symbol -> small-integer exponent.
  map<string, int32> coefficients = 2;
  // Sigma distance given propagated measurement uncertainty.
  double sigma_score = 3;
  int32 complexity = 4;
  // Human-readable rendering of the relation.
  string formatted = 5;
  string verdict = 6;
}

// Numeric relation search: named symmetry hypotheses + blind small-integer scan + PSLQ
// validation, sigma-scored with look-elsewhere accounting.
message DiscoverReport {
  repeated string named_hypothesis_lines = 1;
  repeated RelationCandidate candidates = 2;
  string markdown = 3;
}

// Counters for one synthesis run/shard.
message SynthesisStats {
  int32 pairs = 1;
  int32 eliminations = 2;
  int32 candidates = 3;
  int32 tautologies = 4;
  int32 known = 5;
  int32 dupes = 6;
  int32 kept = 7;
}

// One relation produced by exhaustive formula synthesis.
message SynthesizedRelation {
  string lhs = 1;
  string rhs = 2;
  repeated string parent_formula_ids = 3;
  string eliminated_symbol = 4;
  // 1 = pairwise, 2 = recombined survivor.
  int32 depth = 5;
  // New symbol co-occurrence edges this relation creates (the cartographic metric).
  repeated string new_edges = 6;
  // Inherited weakest parent tier.
  string tier = 7;
  optional double residual = 8;
}

// Request for one shard of an exhaustive synthesis run. Pairs are partitioned
// deterministically by index modulo shard_count.
message SynthesizeShardRequest {
  Catalog catalog = 1;
  int32 shard_index = 2;
  int32 shard_count = 3;
  // Wall-clock budget for this shard; the node stops starting new candidates when spent.
  int32 max_wall_ms = 4;
}

// One streamed synthesis event: a found relation, or the final counters.
message SynthesizeEvent {
  oneof payload {
    SynthesizedRelation relation = 1;
    SynthesisStats final_stats = 2;
  }
  // True if the shard stopped early because its wall-clock budget was spent.
  bool truncated = 3;
}

// Betweenness centrality and articulation-point status of one graph node.
message CentralityEntry {
  string node = 1;
  double betweenness = 2;
  bool articulation_point = 3;
}

// Graph-theoretic structure analysis: which nodes the connectivity of physics routes
// through, and what removing each cut vertex severs.
message StructureReport {
  repeated CentralityEntry centrality = 1;
  repeated string articulation_points = 2;
  string markdown = 3;
}

// The combined result of a full catalog sweep (all unary engine checks).
message SweepReport {
  ValidationReport validation = 1;
  DimensionsReport dimensions = 2;
  UnitsReport units = 3;
  GraphReport graph = 4;
  BuckinghamReport buckingham = 5;
  DeriveReport derive = 6;
  DiscoverReport discover = 7;
  StructureReport structure = 8;
  // Rendered summary of the whole sweep.
  string markdown_summary = 9;
}
