[project]
name = "formularium"
version = "0.1.0"
description = "Tooling for the Formularium physics catalog on Axiom: migration generator, repo orchestration, and fleet CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "sympy>=1.12",
    "pyyaml>=6.0",
]

[project.scripts]
formularium = "formularium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formularium"]

[tool.ruff]
line-length = 100
